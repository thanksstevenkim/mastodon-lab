name: Docusaurus prototype build (no deploy)

on:
  pull_request:
    paths:
      - 'site/**'
      - 'incidents/**'
      - 'runbooks/**'
      - 'update-log/**'
      - 'operations/**'
      - '.github/workflows/docusaurus-prototype-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install site dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Build both locales
        working-directory: site
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Check desktop and mobile browser views
        working-directory: site
        run: npm run visual-check
      - name: Save visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastodon-lab-visual-snapshots
          path: site/visual-snapshots/
          if-no-files-found: warn
